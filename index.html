<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウィキ名推理 - 法的情報</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            line-height: 1.8;
            color: #333;
            background: linear-gradient(135deg, #1a73e8 0%, #ff9800 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .title-wiki {
            color: #1a73e8;
        }
        .title-name {
            color: #ff9800;
        }
        .title-mystery {
            color: #1a73e8;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-button {
            display: block;
            padding: 18px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .link-terms {
            background: #1a73e8;
            color: white;
        }
        .link-terms:hover {
            background: #1557b0;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(26, 115, 232, 0.4);
        }
        .link-privacy {
            background: #ff9800;
            color: white;
        }
        .link-privacy:hover {
            background: #f57c00;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 152, 0, 0.4);
        }
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>
            <span class="title-wiki">ウィキ</span><span class="title-name">名</span><span class="title-mystery">推理</span>
        </h1>
        <p class="subtitle">Wikipedia記事名を当てよう！</p>
        
        <div class="links">
            <a href="terms.html" class="link-button link-terms">📜 利用規約</a>
            <a href="privacy.html" class="link-button link-privacy">🔒 プライバシーポリシー</a>
        </div>
        
        <p class="footer">© 2025 ウィキ名推理</p>
    </div>
</body>
</html>
